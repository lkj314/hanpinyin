# HanPinyin —— 拼音输入，候选窗输出韩文（及游戏英文黑话直打）
# 引擎组成：
#   * translator（默认，table_translator） -> 韩文等自定义词条（hanpinyin.dict.yaml）
#   * 英文黑话（gg/gank/mid diff…）同在上表，键=英文本身，直接打出
# 2026-09-25 起【专攻韩文】：script_translator@cn（luna_pinyin 中文）已移除——
# 实测它占掉候选窗 75% 的格子全是中文谐音噪音，用户中文交给搜狗输入法。
#
# 更新词库：改 data/*.json / rime/extra_phrases.txt / data/shortcodes.tsv
#           -> 跑 build_dict.py -> 小狼毫「重新部署」
#
# 关键排坑（2026-08-31）：小狼毫「部署」只编译【默认 translator 的 dictionary】！
# 因此韩文词典必须挂在默认 translator 上（translator.dictionary: hanpinyin），
# 不能只挂在 table_translator@han 这种命名 translator 上，否则部署阶段根本不会编译它
# （现象：运行时报 "Error loading table for dictionary 'hanpinyin'" 且永远打不出韩文）。

schema:
  schema_id: sino_mix
  name: "韩文拼音 HanPinyin"
  version: "2.5"
  description: 韩文拼音输入（专精版）：候选即韩文，支持模糊拼音、速记码与选词自学习

switches:
  - name: ascii_mode
    states: [中文, 英文]
    reset: 0
  - name: full_shape
    states: [半角, 全角]
    reset: 0

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator          # 韩文等自定义词条（默认 translator -> 会被部署编译）
  filters:
    - simplifier
    - uniquifier

# ===== 翻页 / 选词按键（显式绑定，避免默认按键摸不到）=====
key_binder:
  bindings:
    - {when: paging,     accept: minus,     send: Page_Up}      # - 上一页
    - {when: has_menu,   accept: equal,     send: Page_Down}    # = 下一页
    - {when: paging,     accept: comma,     send: Page_Up}      # , 上一页
    - {when: has_menu,   accept: period,    send: Page_Down}    # . 下一页
    - {when: paging,     accept: bracketleft,  send: Page_Up}    # [ 上一页
    - {when: has_menu,   accept: bracketright, send: Page_Down}  # ] 下一页
    - {when: paging,     accept: Page_Up,   send: Page_Up}
    - {when: paging,     accept: Page_Down, send: Page_Down}

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: "'"
  # ===== 模糊拼音（常见平翘舌 / 边鼻音 / 前后鼻音混读）=====
  algebra:
    - derive/^([zcs])h/$1/            # zh, ch, sh -> z, c, s
    - derive/^([zcs])([^h])/$1h$2/    # z, c, s -> zh, ch, sh
    - derive/([aei])ng/$1n/           # ang, eng, ing -> an, en, in
    - derive/([aei])n/$1ng/           # an, en, in -> ang, eng, ing
    - derive/^n/l/                    # n -> l
    - derive/^l/n/                    # l -> n
    - derive/^r/l/                    # r -> l
    - derive/^l/r/                    # l -> r
    - derive/^f/h/                    # f -> h
    - derive/^h/f/                    # h -> f

# 默认 translator = 韩文等自定义词条（table_translator）
# 必须挂在默认 translator 上，部署阶段才会编译 hanpinyin 词典
translator:
  dictionary: hanpinyin
  enable_user_dict: true      # 选词自学习：常选的韩文词会加权上浮（已核实不滤谚文；
                              # 2026-10-31 隔离实验实测：选过的词下次同码跳到首位）
  enable_sentence: false      # 连写码组句不可控，保持关闭（☯ 组句候选是临时的，不落库）
  enable_completion: false    # 2026-09-25 关闭：实测补全会把无关长码拉进候选窗
                              # （打 hao 冒出 맛있어요/짜증나），且补全只 -1 质量几乎无效
  # 注：2026-09-25 曾开启 enable_encoder + encode_commit_history（长句编码成用户词组），
  # 2026-10-31 实测该链路对韩文连写词典完全无效（词典缺 encoder 设置 + librime 拆词
  # 环节不兼容多音节连写词，编码产物从不落库），开关已移除，schema v2.5。
  # 归因与复验方法见 docs/SELF-LEARNING-MEMO.md；高频长句改走 userdb 挖矿固化路线。
  # 排序说明：候选质量 = exp(词典权重) + initial_quality（librime 源码实测）。
  # 词典权重体系：速记码 110 > 基石词 100 > 主词条 10~14 > 变体码 5~9，
  # 韩文排前靠的是权重差，initial_quality 影响可忽略（此前注释有误，已删）。
